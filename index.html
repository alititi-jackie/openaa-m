<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="robots"
      content="noindex,nofollow,noarchive,nosnippet,noimageindex"
    />
    <meta
      name="googlebot"
      content="noindex,nofollow,noarchive,nosnippet,noimageindex"
    />
    <meta name="twitter:image" content="https://img.openaa.com/logo.png" />
    <link rel="icon" href="https://img.openaa.com/favicon.ico" />
    <link
      rel="apple-touch-icon"
      href="https://img.openaa.com/apple-touch-icon.png"
    />
    <title>📍 Jackie 的地址电话本</title>
    <style>
      :root {
        --blue: #1976d2;
        --border: #e5e7eb;
        --text: #0f172a;
        --muted: #64748b;
        --bg: #f4f4f5;
        --shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
        --amber-bg: rgba(255, 251, 235, 0.75);
        --amber-border: #fde68a;
        --amber-text: #78350f;
      }
      * {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        background: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", Arial, sans-serif;
      }
      button,
      input {
        font: inherit;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      .page {
        max-width: 860px;
        margin: 0 auto;
        padding: 16px 14px 28px;
      }
      .topbar {
        display: grid;
        gap: 10px;
        margin-bottom: 14px;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-width: 0;
        margin: 2px auto 0;
      }
      .brand-logo {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        object-fit: contain;
      }
      .brand-title {
        font-size: 19px;
        font-weight: 950;
        line-height: 1;
        white-space: nowrap;
        letter-spacing: -0.03em;
      }
      .actions-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .actions-right {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-left: auto;
      }
      .top-button {
        min-height: 40px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: #fff;
        color: #334155;
        padding: 0 14px;
        font-size: 14px;
        font-weight: 800;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
        cursor: pointer;
      }
      .top-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        white-space: nowrap;
      }
      .auth-screen {
        min-height: calc(100dvh - 44px);
        display: grid;
        place-items: center;
        padding: 22px 14px;
      }
      .auth-card {
        width: 100%;
        max-width: 420px;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: #fff;
        padding: 22px;
        box-shadow: var(--shadow);
      }
      .auth-brand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        margin-bottom: 18px;
      }
      .auth-brand img {
        width: 32px;
        height: 32px;
        border-radius: 9px;
        object-fit: contain;
      }
      .auth-title {
        margin: 0;
        font-size: 20px;
        font-weight: 950;
        letter-spacing: -0.03em;
        text-align: center;
      }
      .auth-label {
        display: grid;
        gap: 8px;
        color: #475569;
        font-size: 14px;
        font-weight: 850;
      }
      .auth-input {
        min-height: 48px;
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: #fff;
        color: var(--text);
        padding: 0 14px;
        font-size: 15px;
        outline: none;
      }
      .auth-input:focus,
      .search:focus {
        border-color: var(--blue);
        box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.12);
      }
      .remember-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 12px;
        color: #64748b;
        font-size: 13px;
        font-weight: 800;
        user-select: none;
      }
      .remember-row input {
        width: 17px;
        height: 17px;
        accent-color: var(--blue);
      }
      .auth-submit {
        width: 100%;
        min-height: 48px;
        margin-top: 16px;
        border: 0;
        border-radius: 16px;
        background: var(--blue);
        color: #fff;
        font-size: 16px;
        font-weight: 950;
        cursor: pointer;
        box-shadow: 0 12px 24px rgba(25, 118, 210, 0.2);
      }
      .auth-error {
        min-height: 22px;
        margin: 10px 0 0;
        color: #dc2626;
        font-size: 13px;
        font-weight: 850;
        text-align: center;
      }
      .app[hidden],
      .auth-screen[hidden] {
        display: none;
      }
      .title {
        margin: 0 0 12px;
        font-size: 0;
        height: 0;
        overflow: hidden;
      }
      .panel {
        display: grid;
        gap: 12px;
      }
      .tabs-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      .tabs {
        display: inline-flex;
        padding: 4px;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: var(--shadow);
      }
      .tab {
        border: 0;
        border-radius: 14px;
        background: transparent;
        color: #475569;
        min-height: 38px;
        padding: 0 14px;
        font-size: 15px;
        font-weight: 900;
        cursor: pointer;
        white-space: nowrap;
      }
      .tab.active {
        background: var(--blue);
        color: #fff;
        box-shadow: 0 8px 18px rgba(25, 118, 210, 0.22);
      }
      .count {
        color: var(--muted);
        font-size: 13px;
        font-weight: 800;
        padding-right: 2px;
      }
      .search {
        min-height: 48px;
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: #fff;
        color: var(--text);
        padding: 0 16px;
        font-size: 16px;
        font-weight: 700;
        outline: none;
        box-shadow: var(--shadow);
      }
      .search::placeholder {
        color: #cbd5e1;
      }
      .grid {
        display: grid;
        gap: 10px;
      }
      .grid.phone {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .grid.address {
        grid-template-columns: 1fr;
      }
      .card {
        display: block;
        min-height: 86px;
        border: 1px solid #f1f5f9;
        border-radius: 20px;
        background: #fff;
        padding: 8px;
        box-shadow: var(--shadow);
        transition: transform 0.15s ease;
      }
      .card:active {
        transform: scale(0.99);
      }
      .card-inner {
        display: block;
        min-height: 70px;
        border-radius: 16px;
        background: #f8fafc;
        padding: 12px;
      }
      .name {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 16px;
        font-weight: 950;
        line-height: 1.2;
      }
      .address-title-row {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .address-title-row .name {
        min-width: 0;
        flex: 1;
      }
      .copy-address {
        flex: 0 0 auto;
        min-height: 28px;
        border: 1px solid #bfdbfe;
        border-radius: 999px;
        background: #eff6ff;
        color: #1976d2;
        padding: 0 10px;
        font-size: 12px;
        font-weight: 900;
        line-height: 1;
        cursor: pointer;
      }
      .address-card {
        cursor: pointer;
      }
      .value {
        display: block;
        margin-top: 10px;
        color: #475569;
        font-size: 13px;
        font-weight: 800;
        line-height: 1.4;
        overflow-wrap: anywhere;
      }
      .phone .value {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .empty {
        border: 1px dashed #cbd5e1;
        border-radius: 20px;
        background: #fff;
        padding: 22px;
        text-align: center;
        color: #94a3b8;
        font-size: 14px;
        font-weight: 800;
        box-shadow: var(--shadow);
      }
      .notice {
        margin-top: 12px;
        border: 1px solid var(--amber-border);
        border-radius: 20px;
        background: var(--amber-bg);
        padding: 16px;
      }
      .notice-title {
        margin: 0;
        color: var(--amber-text);
        font-size: 16px;
        font-weight: 900;
      }
      .notice-text {
        margin: 6px 0 0;
        color: rgba(120, 53, 15, 0.82);
        font-size: 15px;
        font-weight: 650;
        line-height: 1.65;
      }
      .helper {
        margin: 16px 0 0;
        color: #94a3b8;
        font-size: 12px;
        line-height: 1.7;
        text-align: center;
      }
      @media (min-width: 768px) {
        .grid.phone {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        .grid.address {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 390px) {
        .topbar {
          gap: 9px;
        }
        .actions-row,
        .actions-right {
          gap: 6px;
        }
        .top-button {
          min-height: 38px;
          padding: 0 10px;
          font-size: 13px;
        }
        .brand {
          gap: 7px;
        }
        .brand-logo {
          width: 28px;
          height: 28px;
        }
        .brand-title {
          font-size: 17px;
        }
        .tab {
          padding: 0 11px;
          font-size: 14px;
        }
      }
    </style>
  </head>
  <body>
    <section class="auth-screen" id="authScreen" hidden>
      <form class="auth-card" id="authForm">
        <div class="auth-brand">
          <img src="https://img.openaa.com/logo.png" alt="OpenAA" />
          <h1 class="auth-title">📍 Jackie 的地址电话本</h1>
        </div>
        <label class="auth-label"
          >请输入密码<input
            class="auth-input"
            id="passwordInput"
            type="password"
            autocomplete="current-password"
            inputmode="text"
            placeholder="请输入我的手机号码" /></label
        ><label class="remember-row"
          ><input id="rememberDevice" type="checkbox" /><span
            >记住这台设备</span
          ></label
        ><button class="auth-submit" type="submit">进入</button>
        <p class="auth-error" id="authError"></p>
      </form>
    </section>
    <main class="page app" id="app" hidden>
      <div class="topbar">
        <div class="brand" aria-label="📍 Jackie 的地址电话本">
          <img
            class="brand-logo"
            src="https://img.openaa.com/logo.png"
            alt="OpenAA"
          /><span class="brand-title">📍 Jackie 的地址电话本</span>
        </div>
        <div class="actions-row">
          <a
            class="top-button top-link"
            href="https://go.openaa.com/nav/nyc.html"
            target="_blank"
            rel="noopener noreferrer"
            >🗽 纽约景点地址</a
          >
          <div class="actions-right">
            <button class="top-button" type="button" id="shareButton">
              分享</button
            ><button class="top-button" type="button" id="logoutButton">
              退出
            </button>
          </div>
        </div>
      </div>
      <h1 class="title">Jackie 的地址电话本</h1>
      <section class="panel" aria-label="Jackie 的地址电话本">
        <div class="tabs-row">
          <div class="tabs" role="tablist" aria-label="分类">
            <button
              class="tab active"
              type="button"
              id="nyTab"
              role="tab"
              aria-selected="true"
            >
              纽约地址</button
            ><button
              class="tab"
              type="button"
              id="paTab"
              role="tab"
              aria-selected="false"
            >
              宾州地址</button
            ><button
              class="tab"
              type="button"
              id="phoneTab"
              role="tab"
              aria-selected="false"
            >
              电话本
            </button>
          </div>
          <div class="count" id="countText"></div>
        </div>
        <input
          class="search"
          id="searchInput"
          type="search"
          autocomplete="off"
          placeholder="搜索名称或地址"
        />
        <div class="grid address" id="list"></div>
      </section>
      <section class="notice" aria-label="使用提醒">
        <h2 class="notice-title">使用提醒</h2>
        <p class="notice-text">
          这是个人便捷记录工具。请不要保存密码、证件、银行卡等重要隐私资料，并定期复制本文件做备份。
        </p>
      </section>
      <p class="helper"><a href="https://openaa.com/">OpenAA.com</a></p>
    </main>
    <script>
      const PASSWORD_ENABLED = true,
        ACCESS_PASSWORD = "6468897111",
        REMEMBER_DEFAULT = false,
        REMEMBER_KEY = "jackie_directory_unlocked";
      const PHONEBOOK = [
        { name: "成", phone: "646-889-7111" },
        { name: "玲", phone: "646-889-7222" },
        { name: "欢", phone: "646-889-7333" },
        { name: "保险公司", phone: "800-555-0000" },
      ];
      const ADDRESSES = [
        {name: "7大道地铁口",address: "Seventh Avenue & 62nd Street Brooklyn, NY 11220",region: "ny",},
        { name: "8大道地铁口", address: "8th Ave & 62nd St, Brooklyn, NY 11220", region: "ny" },
        {name: "36街地铁口",address: "36th Street & Fourth Avenue Brooklyn, NY 11232",region: "ny",},
        {name: "36街 Costco",address: "976 3rd Ave Brooklyn, NY 11232",region: "ny",},
        {name: "Omiya Sushi泽欢",address: "Omiya Sushi, 8618 4th Ave, Brooklyn, NY 11209",region: "ny",},
        {name: "芳姑新屋",address: "1740 E 54th St, Brooklyn, NY 11234",region: "ny",},
        {name: "旧芳姑20大道82街 2053",address: "2053 82nd St,Brooklyn,NY 11214",region: "ny",},
        {name: "纽约车站",address: "31st St & 8th Ave New York, NY 10001",region: "ny",},
        {name: "机场 JFK",address: "John F. Kennedy International Airport, Queens, NY",region: "ny",},


        {name: "宾州地址",address: "215 Quality Rd, Dupont, PA 18641-1912, US",region: "pa",},
        {name: "宾州717-王振伟",address: "717 Main St, Duryea, PA 18642, US",region: "pa",},
        {name: "宾州162-袁家峰",address: "162 Center St, Pittston, PA 18640-2612, US",region: "pa",},
        {name: "宾州长途车站",address: "Flix Bus Stop 609 luzerne st, Scranton, PA 18504, US",region: "pa",},
        {name: "宾州地板厂",address: "160-180 Independence Dr, Pittston, PA 18640",region: "pa",},



      ];
      const state = { type: "ny", query: "" };
      const nyTab = document.getElementById("nyTab"),
        paTab = document.getElementById("paTab"),
        phoneTab = document.getElementById("phoneTab"),
        searchInput = document.getElementById("searchInput"),
        list = document.getElementById("list"),
        countText = document.getElementById("countText"),
        shareButton = document.getElementById("shareButton"),
        logoutButton = document.getElementById("logoutButton"),
        authScreen = document.getElementById("authScreen"),
        app = document.getElementById("app"),
        authForm = document.getElementById("authForm"),
        passwordInput = document.getElementById("passwordInput"),
        rememberDevice = document.getElementById("rememberDevice"),
        authError = document.getElementById("authError");
      function normalize(v) {
        return String(v || "")
          .trim()
          .toLowerCase();
      }
      function isRemembered() {
        try {
          return localStorage.getItem(REMEMBER_KEY) === "yes";
        } catch (_) {
          return false;
        }
      }
      function isSessionUnlocked() {
        try {
          return sessionStorage.getItem(REMEMBER_KEY) === "yes";
        } catch (_) {
          return false;
        }
      }
      function unlockApp(remember) {
        if (remember)
          try {
            localStorage.setItem(REMEMBER_KEY, "yes");
          } catch (_) {}
        try {
          sessionStorage.setItem(REMEMBER_KEY, "yes");
        } catch (_) {}
        authScreen.hidden = true;
        app.hidden = false;
        render();
      }
      function lockApp() {
        try {
          localStorage.removeItem(REMEMBER_KEY);
          sessionStorage.removeItem(REMEMBER_KEY);
        } catch (_) {}
        passwordInput.value = "";
        rememberDevice.checked = REMEMBER_DEFAULT;
        authError.textContent = "";
        app.hidden = true;
        authScreen.hidden = false;
        setTimeout(() => passwordInput.focus(), 50);
      }
      function initializeAccess() {
        if (!PASSWORD_ENABLED || isRemembered() || isSessionUnlocked()) {
          unlockApp(false);
          return;
        }
        rememberDevice.checked = REMEMBER_DEFAULT;
        authScreen.hidden = false;
        app.hidden = true;
        setTimeout(() => passwordInput.focus(), 50);
      }
      function filteredItems() {
        const q = normalize(state.query);
        let items =
          state.type === "phone"
            ? PHONEBOOK
            : ADDRESSES.filter((x) => x.region === state.type);
        if (!q) return items;
        return items.filter((item) => {
          const v = state.type === "phone" ? item.phone : item.address;
          return normalize(item.name).includes(q) || normalize(v).includes(q);
        });
      }
      function mapUrl(address) {
        const e = encodeURIComponent(address),
          ios = /iPad|iPhone|iPod/.test(navigator.userAgent),
          android = /Android/i.test(navigator.userAgent);
        if (android) return `geo:0,0?q=${e}`;
        if (ios) return `https://maps.apple.com/?q=${e}`;
        return `https://www.google.com/maps/search/?api=1&query=${e}`;
      }
      function escapeHtml(v) {
        return String(v || "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }
      function escapeAttribute(v) {
        return escapeHtml(v).replaceAll("`", "&#096;");
      }
      function render() {
        const isPhone = state.type === "phone",
          items = filteredItems();
        [
          [nyTab, "ny"],
          [paTab, "pa"],
          [phoneTab, "phone"],
        ].forEach(([tab, type]) => {
          const active = state.type === type;
          tab.classList.toggle("active", active);
          tab.setAttribute("aria-selected", active ? "true" : "false");
        });
        searchInput.placeholder = isPhone
          ? "搜索姓名或电话号码"
          : "搜索名称或地址";
        list.className = `grid ${isPhone ? "phone" : "address"}`;
        countText.textContent = `${items.length} 条`;
        if (!items.length) {
          list.innerHTML = '<div class="empty">暂无内容</div>';
          return;
        }
        list.innerHTML = items
          .map((item) => {
            const name = escapeHtml(item.name),
              value = escapeHtml(isPhone ? item.phone : item.address);
            if (isPhone)
              return `<a class="card" href="tel:${encodeURIComponent(item.phone)}"><span class="card-inner"><span class="name">${name}</span><span class="value">${value}</span></span></a>`;
            const href = mapUrl(item.address),
              addr = escapeAttribute(item.address);
            return `<div class="card address-card" role="link" tabindex="0" data-map-url="${escapeAttribute(href)}"><div class="card-inner"><div class="address-title-row"><span class="name">${name}</span><button class="copy-address" type="button" data-address="${addr}" aria-label="复制地址">复制</button></div><span class="value">${value}</span></div></div>`;
          })
          .join("");
      }
      function openMapUrl(url) {
        if (!url) return;
        if (url.startsWith("geo:")) {
          location.href = url;
          return;
        }
        window.open(url, "_blank", "noopener,noreferrer");
      }
      async function copyText(v) {
        if (navigator.clipboard && window.isSecureContext)
          try {
            await navigator.clipboard.writeText(v);
            return true;
          } catch (_) {}
        const t = document.createElement("textarea");
        t.value = v;
        t.setAttribute("readonly", "");
        t.style.position = "fixed";
        t.style.top = "-9999px";
        document.body.appendChild(t);
        t.select();
        let ok = false;
        try {
          ok = document.execCommand("copy");
        } catch (_) {}
        document.body.removeChild(t);
        return ok;
      }
      function selectTab(type) {
        state.type = type;
        state.query = "";
        searchInput.value = "";
        render();
      }
      nyTab.addEventListener("click", () => selectTab("ny"));
      paTab.addEventListener("click", () => selectTab("pa"));
      phoneTab.addEventListener("click", () => selectTab("phone"));
      searchInput.addEventListener("input", (e) => {
        state.query = e.target.value;
        render();
      });
      list.addEventListener("click", async (e) => {
        const b = e.target.closest(".copy-address");
        if (b) {
          e.preventDefault();
          e.stopPropagation();
          const ok = await copyText(b.getAttribute("data-address") || ""),
            old = b.textContent;
          b.textContent = ok ? "已复制" : "复制失败";
          setTimeout(() => (b.textContent = old || "复制"), 1500);
          return;
        }
        const card = e.target.closest(".address-card");
        if (card) openMapUrl(card.getAttribute("data-map-url") || "");
      });
      list.addEventListener("keydown", (e) => {
        if (e.key !== "Enter" && e.key !== " ") return;
        const card = e.target.closest(".address-card");
        if (!card || e.target.closest(".copy-address")) return;
        e.preventDefault();
        openMapUrl(card.getAttribute("data-map-url") || "");
      });
      authForm.addEventListener("submit", (e) => {
        e.preventDefault();
        if (passwordInput.value === ACCESS_PASSWORD) {
          unlockApp(rememberDevice.checked);
          return;
        }
        authError.textContent = "密码不正确";
        passwordInput.select();
      });
      logoutButton.addEventListener("click", lockApp);
      shareButton.addEventListener("click", async () => {
        const d = {
          title: "Jackie 的地址电话本",
          text: "个人地址电话本",
          url: location.href,
        };
        if (navigator.share)
          try {
            await navigator.share(d);
            return;
          } catch (_) {}
        try {
          await navigator.clipboard.writeText(location.href);
          alert("链接已复制");
        } catch (_) {
          alert("当前浏览器不支持分享，请手动复制地址栏链接。");
        }
      });
      initializeAccess();
    </script>
  </body>
</html>
